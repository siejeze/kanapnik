<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanapniki</title>
<meta name="theme-color" content="#D9542B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#fff; --ink:#17130F; --mute:#6B6259; --line:#EDE7DF;
  --pad:20px; --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none;
}
.wrap{max-width:560px;margin:0 auto;min-height:100dvh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
h1,h2,h3{letter-spacing:-.02em;line-height:1.08;font-weight:800}

/* ---------- EKRAN GŁÓWNY ---------- */
#home{padding:0 var(--pad) 40px}
.hero{padding:calc(env(safe-area-inset-top) + 34px) 0 22px}
.hero h1{font-size:46px;letter-spacing:-.035em}
.hero p{color:var(--mute);font-size:16px;margin-top:8px;max-width:30ch}
.sekcja{margin-top:30px}
.sekcja > h2{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin-bottom:12px}
.karty{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.karta{
  position:relative;border-radius:var(--r);padding:16px 15px 15px;min-height:118px;
  display:flex;flex-direction:column;justify-content:flex-end;text-align:left;
  color:#fff;overflow:hidden;transition:transform .12s ease;
}
.karta:active{transform:scale(.965)}
.karta .nm{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.karta .sub{font-size:12.5px;opacity:.85;margin-top:3px;font-weight:500}
.karta .num{position:absolute;top:9px;right:14px;font-size:44px;font-weight:800;
  opacity:.19;letter-spacing:-.05em;line-height:1}
.karta.wide{grid-column:1/-1;min-height:0;padding:17px 18px;flex-direction:row;
  align-items:center;gap:12px;justify-content:flex-start}
.karta.wide .nm{font-size:18px}
.karta.wide .ar{margin-left:auto;font-size:22px;opacity:.7}
.tagwip{position:absolute;top:11px;left:14px;font-size:9.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;background:rgba(255,255,255,.28);
  padding:3px 7px;border-radius:99px}
.stopka{margin-top:34px;color:var(--mute);font-size:13.5px;line-height:1.55}

/* ---------- WIDOK PRZEPISU ---------- */
#view{position:fixed;inset:0;background:#fff;overflow-y:auto;z-index:20;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.7,.3,1);
  -webkit-overflow-scrolling:touch}
#view.on{transform:none}
.top{padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 30px;color:#fff;position:relative}
.wstecz{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:21px;line-height:1}
.top h2{font-size:38px;margin-top:44px;letter-spacing:-.035em}
.top .kicker{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  opacity:.8;margin-top:44px;position:absolute;left:var(--pad);top:calc(env(safe-area-inset-top) + 14px)}
.top p{margin-top:11px;font-size:16px;opacity:.94;line-height:1.45;max-width:34ch}
.body{padding:0 var(--pad) 120px;max-width:560px;margin:0 auto}
.blok{margin-top:26px}
.blok > h3{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin-bottom:11px}
ul.sk{list-style:none}
ul.sk li{padding:11px 0;border-bottom:1px solid var(--line);font-size:17px}
ul.sk li:last-child{border-bottom:0}
ol.kr{list-style:none;counter-reset:k}
ol.kr li{counter-increment:k;position:relative;padding:9px 0 9px 38px;font-size:16.5px;line-height:1.45}
ol.kr li::before{content:counter(k);position:absolute;left:0;top:9px;width:25px;height:25px;
  border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:#fff}
.uw{border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.45;margin-bottom:9px}
.uw:last-child{margin-bottom:0}
.mie{border:2px solid var(--line);border-radius:18px;padding:6px 16px 14px}
.mie .rz{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.mie .rz:last-of-type{border-bottom:0}
.mie .rz b{font-weight:700;font-variant-numeric:tabular-nums}
.nota{color:var(--mute);font-size:14.5px;line-height:1.5;margin-top:11px}
.pas{border-radius:18px;padding:16px 18px;color:#fff}
.pas .duzo{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.pas .mal{font-size:13px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;opacity:.82}

/* ---------- MINUTNIK ---------- */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:11px var(--pad) calc(env(safe-area-inset-bottom) + 13px);
  background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:none}
#view.on ~ .mini,.mini.on{display:block}
.mini .row{display:flex;gap:9px;align-items:center;max-width:520px;margin:0 auto}
.mini button.t{flex:1;border-radius:14px;padding:13px 8px;font-size:15px;font-weight:700;color:#fff}
.mini .zegar{font-size:31px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:96px;text-align:center}
.mini .stop{padding:12px 15px;border-radius:14px;background:var(--line);font-weight:700;font-size:15px}
.mini .co{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <main id="home"></main>
</div>
<section id="view" aria-hidden="true"></section>
<div class="mini" id="mini"></div>

<script src="przepisy.js"></script>
<script>
const $ = s => document.querySelector(s);

/* ---------- EKRAN GŁÓWNY ---------- */
function home(){
  const sprawdzone = PRZEPISY.filter(p=>p.grupa==="sprawdzone");
  const eksper     = PRZEPISY.filter(p=>p.grupa==="eksperymenty");
  const karta = (p,i)=>`
    <button class="karta" style="background:${p.kolor}" onclick="otworz('${p.id}')">
      <span class="num">${i+1}</span>
      ${p.wOpracowaniu?'<span class="tagwip">w opracowaniu</span>':''}
      <span class="nm">${p.nazwa}</span>
      <span class="sub">2 kanapniki</span>
    </button>`;
  $("#home").innerHTML = `
    <div class="hero">
      <h1>Kanapniki</h1>
      <p>Keto pieczywo z mąki laskowej. Własne przepisy i eksperymenty.</p>
    </div>
    <div class="karty">
      <button class="karta wide" style="background:#17130F" onclick="otworz('_jak')">
        <span class="nm">Jak piec wszystkie Kanapniki</span><span class="ar">→</span>
      </button>
      <button class="karta wide" style="background:#5A544C" onclick="otworz('_zanim')">
        <span class="nm">Zanim zaczniesz</span><span class="ar">→</span>
      </button>
    </div>
    <div class="sekcja">
      <h2>Sprawdzone</h2>
      <div class="karty">${sprawdzone.map(karta).join("")}</div>
    </div>
    <div class="sekcja">
      <h2>Eksperymenty</h2>
      <div class="karty">${eksper.map(karta).join("")}</div>
    </div>
    <p class="stopka">Eksperymenty nie zostały jeszcze upieczone. To kierunki, nie gotowe przepisy.</p>`;
}

/* ---------- STRONY STAŁE ---------- */
const STALE = {
  _jak:{ nazwa:"Jak piec", kolor:"#17130F", kicker:"Instrukcja podstawowa",
    opis:"Wszystkie wersje robi się tak samo. W przepisach zapisane są tylko różnice.",
    html:()=>`
      <div class="blok"><h3>Przygotowanie</h3>
        <ol class="kr">${BAZA.kroki.map(k=>`<li><span></span>${k}</li>`).join("")}</ol></div>
      <div class="blok"><h3>Pieczenie</h3>
        <div class="pas" style="background:#D9542B">
          <div class="mal">Piekarnik</div><div class="duzo">180 °C · 16–18 min</div>
          <div style="margin-top:7px;font-size:15px;opacity:.93">Góra/dół, środkowy poziom. Wierzch lekko złocisty, środek sprężysty.</div>
        </div></div>
      <div class="blok"><h3>Studzenie</h3>
        <div class="pas" style="background:#2E3A6E">
          <div class="mal">Na kratce, z papierem</div><div class="duzo">20 minut</div>
          <div style="margin-top:7px;font-size:15px;opacity:.93">Nie krój wcześniej — nóż rozerwie gorący środek i kromka zostanie zbita.</div>
        </div></div>
      <div class="blok"><h3>Przechowywanie</h3>
        <ul class="sk">
          <li>W papierze albo bawełnianej ściereczce, nie w folii.</li>
          <li>W temperaturze pokojowej — 2 dni</li>
          <li>W lodówce — do 5 dni</li>
        </ul></div>` },
  _zanim:{ nazwa:"Zanim zaczniesz", kolor:"#5A544C", kicker:"Podstawy",
    opis:"Pięć rzeczy, które warto wiedzieć raz.",
    html:()=>`
      <div class="blok"><h3>Czego potrzebujesz</h3>
        <ul class="sk">
          <li><b>Waga</b> — tylko do dwóch mąk, laskowej i bambusowej. Cała reszta to łyżeczki.</li>
          <li><b>Blacha</b> — duża blacha piekarnika z papierem. Ciasto formujesz swobodnie, na grubość około 1 cm.</li>
          <li><b>Kratka</b> — do studzenia. Na blasze ciasto odparuje sobie spód.</li>
        </ul></div>
      <div class="blok"><h3>Dlaczego akurat to</h3>
        <ul class="sk">
          <li><b>Mąka laskowa</b> daje strukturę i tłuszcz. Jełczeje — trzymaj w chłodzie.</li>
          <li><b>Mąka bambusowa</b> to czyste włókno. Wiąże wodę i trzyma miękkość środka.</li>
          <li><b>Drożdże nieaktywne</b> są dla smaku, nie dla wyrastania. Za wzrost odpowiada piana z białek i proszek.</li>
        </ul></div>
      <div class="blok"><h3>Suche mieszanki</h3>
        <p style="font-size:16px;line-height:1.5;color:var(--mute)">Każdy przepis ma mieszankę na 1 kg mąki. Odsyp z niej tyle, ile idzie mąki w porcji, i dodaj mokre składniki. Proszek do pieczenia z czasem traci moc, a mąka laskowa jełczeje — rób mieszanki na kilka tygodni, nie na rok.</p></div>` }
};

/* ---------- WIDOK PRZEPISU ---------- */
function otworz(id){
  const s = STALE[id];
  const p = s || PRZEPISY.find(x=>x.id===id);
  const kolor = p.kolor;
  let tresc;
  if(s){ tresc = s.html(); }
  else {
    tresc = `
      <div class="blok"><h3>Składniki na 2 kanapniki</h3>
        <ul class="sk">${p.skladniki.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      ${p.roznice.length?`<div class="blok"><h3>Na co uważać</h3>
        ${p.roznice.map(r=>`<div class="uw" style="background:${kolor}14;border-left:4px solid ${kolor}">${r}</div>`).join("")}</div>`:""}
      <div class="blok"><h3>Wykonanie</h3>
        <button class="karta wide" style="background:${kolor};width:100%" onclick="otworz('_jak')">
          <span class="nm">Instrukcja podstawowa</span><span class="ar">→</span></button>
        <div class="pas" style="background:${kolor};margin-top:10px">
          <div class="mal">Pieczenie</div><div class="duzo">180 °C · 16–18 min</div>
          <div style="margin-top:9px" class="mal">Studzenie</div><div class="duzo">20 minut</div>
        </div>
        <p class="nota">${p.potem}</p></div>
      <div class="blok"><h3>Sucha mieszanka · na 1 kg mąki</h3>
        <div class="mie">${p.mieszanka.map(([a,b])=>`<div class="rz"><span>${a}</span><b>${b}</b></div>`).join("")}</div>
        ${p.mieszankaNota?`<p class="nota">${p.mieszankaNota}</p>`:""}</div>`;
  }
  $("#view").innerHTML = `
    <div class="top" style="background:${kolor}">
      <button class="wstecz" onclick="zamknij()" aria-label="Wstecz">←</button>
      <div class="kicker">${s?s.kicker:(p.grupa==="sprawdzone"?"Przepis":"Eksperyment")}</div>
      <h2>${p.nazwa}</h2>
      <p>${p.opis}</p>
    </div>
    <div class="body">${tresc}</div>`;
  $("#view").querySelectorAll("ol.kr li").forEach(li=>li.style.setProperty("--c",kolor));
  const st=document.createElement("style");
  st.textContent=`ol.kr li::before{background:${kolor}}`;
  st.id="dyn"; document.getElementById("dyn")?.remove(); document.head.appendChild(st);
  $("#view").classList.add("on"); $("#view").scrollTop=0;
  document.body.style.overflow="hidden";
  minutnik(kolor, !s || id==="_jak");
  history.pushState({v:id},"","#"+id);
}
function zamknij(){
  $("#view").classList.remove("on"); document.body.style.overflow="";
  $("#mini").classList.remove("on"); stopTimer();
  if(location.hash) history.replaceState({},"",location.pathname);
}
addEventListener("popstate",()=>{ if($("#view").classList.contains("on")) zamknij(); });

/* ---------- MINUTNIK ---------- */
let tInt=null,tLeft=0,tCo="";
function minutnik(kolor,pokaz){
  const m=$("#mini");
  if(!pokaz){ m.classList.remove("on"); return; }
  m.classList.add("on");
  m.innerHTML = tInt ? zegarHTML(kolor) : `
    <div class="row">
      <button class="t" style="background:${kolor}" onclick="startTimer(18*60,'Pieczenie','${kolor}')">Piekę · 18 min</button>
      <button class="t" style="background:#2E3A6E" onclick="startTimer(20*60,'Studzenie','#2E3A6E')">Studzę · 20 min</button>
    </div>`;
}
function zegarHTML(kolor){
  const mm=String(Math.floor(tLeft/60)).padStart(2,"0"), ss=String(tLeft%60).padStart(2,"0");
  return `<div class="row">
      <div><div class="co">${tCo}</div><div class="zegar" style="color:${kolor}">${mm}:${ss}</div></div>
      <button class="stop" style="margin-left:auto" onclick="stopTimer();minutnik('${kolor}',true)">Stop</button>
    </div>`;
}
function startTimer(sek,co,kolor){
  stopTimer(); tLeft=sek; tCo=co;
  $("#mini").innerHTML=zegarHTML(kolor);
  tInt=setInterval(()=>{
    tLeft--;
    if(tLeft<=0){ stopTimer();
      $("#mini").innerHTML=`<div class="row"><div><div class="co">${co}</div>
        <div class="zegar" style="color:${kolor}">00:00</div></div>
        <button class="stop" style="margin-left:auto" onclick="minutnik('${kolor}',true)">Gotowe</button></div>`;
      if(navigator.vibrate) navigator.vibrate([300,150,300,150,500]);
      return; }
    const z=$("#mini").querySelector(".zegar");
    if(z) z.textContent=String(Math.floor(tLeft/60)).padStart(2,"0")+":"+String(tLeft%60).padStart(2,"0");
  },1000);
}
function stopTimer(){ if(tInt){clearInterval(tInt);tInt=null;} }

home();
if(location.hash){ const id=location.hash.slice(1); if(STALE[id]||PRZEPISY.some(p=>p.id===id)) otworz(id); }
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
